[project]
name = "pomadoro-tracker"
version = "1.0.3"
description = "Терминальный (TUI) Pomodoro-трекер на Python и Textual"
readme = "README.md"
authors = [
    { name = "Sergey Ivanov", email = "ivanitch.mail@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
pomo = "src.pomodoro:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
